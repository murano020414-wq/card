<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&family=Montserrat:ital,wght@0,700;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/css/main.css" />
  </head>
  <body>
    <section>
      <div class="card">
        <div class="img-wrapper">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAFCF55a6aKLdI5KR7febgMT8RNG30-z1QMcjS68fTwA&s=10"
            alt=""
            class="img"
          />
        </div>
        <div class="text-wrapper">
          <div class="h1-wrapper">
            <h1 class="name">Spider man</h1>
            <span class="role">hero</span>
          </div>
          <div class="text-btn-wrapper">
            <p class="about">
              легендарный супергерой из комиксов Marvel, обладающий
              сверхчеловеческими силами и борющийся с преступностью
            </p>
            <button class="btn">Узнать більше</button>
          </div>
          <div class="rate-wrapper">
            <img
              src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png"
              alt=""
              width="20px"
              class="rating-img"
            />
            <span class="rating">9.8</span>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
